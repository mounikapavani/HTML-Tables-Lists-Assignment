<!DOCTYPE html>
<html>
<head>
    <title>Rowspan Table</title>
</head>
<body>

<h2>Rowspan Example</h2>

<table border="1">
    <tr>
        <th>Name</th>
        <th>Subject</th>
        <th>Marks</th>
    </tr>

    <tr>
        <td rowspan="2">Mounika</td>
        <td>Python</td>
        <td>90</td>
    </tr>

    <tr>
        <td>Java</td>
        <td>85</td>
    </tr>
</table>

</body>
</html>
