<!DOCTYPE html>
<html>
<head>
    <title>Colspan Table</title>
</head>
<body>

<h2>Colspan Example</h2>

<table border="1">
    <tr>
        <th colspan="3">Student Information</th>
    </tr>

    <tr>
        <th>Name</th>
        <th>Course</th>
        <th>Marks</th>
    </tr>

    <tr>
        <td>Mounika</td>
        <td>CSE</td>
        <td>90</td>
    </tr>
</table>

</body>
</html>
