<!DOCTYPE html>
<html>
<head>
    <title>Ordered List Types</title>
</head>
<body>

<h2>Numbered List</h2>

<ol type="1">
    <li>Python</li>
    <li>Java</li>
    <li>C</li>
</ol>

<h2>Alphabetical List</h2>

<ol type="A">
    <li>Python</li>
    <li>Java</li>
    <li>C</li>
</ol>

<h2>Roman Number List</h2>

<ol type="I">
    <li>Python</li>
    <li>Java</li>
    <li>C</li>
</ol>

</body>
</html>
